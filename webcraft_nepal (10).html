<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Webcraft Nepal — Independent Web Engineering Studio, Biratnagar</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    [data-theme="dark"] {
      --bg:          #080808;
      --bg-2:        #0E0E0E;
      --bg-3:        #141414;
      --surface:     rgba(255, 255, 255, 0.03);
      --surface-2:   rgba(255, 255, 255, 0.015);
      --border:      rgba(255, 255, 255, 0.10);
      --border-2:    rgba(200, 110, 70, 0.25);
      --border-rainbow: linear-gradient(135deg, 
        rgba(218, 119, 68, 0.25), 
        rgba(255, 255, 255, 0.15), 
        rgba(160, 130, 200, 0.15),
        rgba(100, 150, 200, 0.15),
        rgba(218, 119, 68, 0.2)
      );
      --text:        #EAE4DE;
      --text-muted:  #7C7570;
      --text-sub:    #A69F9B;
      --accent:      #C86A3B;
      --accent-2:    #D58455;
      --accent-3:    #E09E77;
      --accent-soft: rgba(200, 110, 70, 0.08);
      --accent-glow: rgba(200, 110, 70, 0.18);
      --shadow-card: 0 8px 32px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.25);
      --shadow-glow: 0 0 32px rgba(200, 110, 70, 0.08);
      --mesh-1: rgba(200, 110, 70, 0.06);
      --mesh-2: rgba(213, 132, 85, 0.03);
      --mesh-3: rgba(224, 158, 119, 0.02);
      --nav-bg: rgba(8, 8, 8, 0.75);
      --mobile-bg: rgba(8, 8, 8, 0.95);
      --progress-grad: linear-gradient(90deg, #C86A3B, #E09E77, #C86A3B);
      --grid-line: rgba(255, 255, 255, 0.015);
      --glow-pulse-from: rgba(200, 110, 70, 0.35);
      --glow-pulse-to:   rgba(200, 110, 70, 0);
      --btn-primary-text: #080808;
      --btn-primary-shadow: rgba(200, 110, 70, 0.2);
      --btn-primary-shadow-hover: rgba(200, 110, 70, 0.35);
      --liquid-shine-top: rgba(255, 255, 255, 0.12);
      --liquid-shine-bottom: rgba(255, 255, 255, 0.0);
      --liquid-refraction: rgba(255, 255, 255, 0.04);
      --liquid-specular: rgba(255, 255, 255, 0.25);
    }

    [data-theme="light"] {
      --bg:          #FAF7F2;
      --bg-2:        #F3ECE2;
      --bg-3:        #ECE3D6;
      --surface:     rgba(255, 255, 255, 0.22);
      --surface-2:   rgba(255, 255, 255, 0.12);
      --border:      rgba(255, 255, 255, 0.3);
      --border-2:    rgba(200, 110, 70, 0.25);
      --border-rainbow: linear-gradient(135deg, 
        rgba(200, 110, 70, 0.25), 
        rgba(255, 255, 255, 0.35), 
        rgba(160, 130, 200, 0.15),
        rgba(100, 150, 200, 0.15),
        rgba(200, 110, 70, 0.2)
      );
      --text:        #241C18;
      --text-muted:  #8C7F75;
      --text-sub:    #665B54;
      --accent:      #B2592B;
      --accent-2:    #C86A3B;
      --accent-3:    #D58455;
      --accent-soft: rgba(200, 110, 70, 0.06);
      --accent-glow: rgba(200, 110, 70, 0.12);
      --shadow-card: 0 6px 20px rgba(100, 60, 20, 0.04), inset 0 1px 1px rgba(255, 255, 255, 0.65);
      --shadow-glow: 0 0 24px rgba(200, 110, 70, 0.06);
      --mesh-1: rgba(200, 110, 70, 0.04);
      --mesh-2: rgba(213, 132, 85, 0.02);
      --mesh-3: rgba(224, 158, 119, 0.015);
      --nav-bg: rgba(250, 247, 242, 0.75);
      --mobile-bg: rgba(250, 247, 242, 0.96);
      --progress-grad: linear-gradient(90deg, #B2592B, #D58455, #B2592B);
      --grid-line: rgba(180, 140, 100, 0.04);
      --glow-pulse-from: rgba(200, 110, 70, 0.25);
      --glow-pulse-to:   rgba(200, 110, 70, 0);
      --btn-primary-text: #FAF7F2;
      --btn-primary-shadow: rgba(200, 110, 70, 0.15);
      --btn-primary-shadow-hover: rgba(200, 110, 70, 0.25);
      --liquid-shine-top: rgba(255, 255, 255, 0.45);
      --liquid-shine-bottom: rgba(255, 255, 255, 0.0);
      --liquid-refraction: rgba(255, 255, 255, 0.1);
      --liquid-specular: rgba(255, 255, 255, 0.55);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      transition: background 0.45s ease, color 0.45s ease;
      cursor: default;
    }

    *, *::before, *::after {
      transition: background-color 0.4s ease, border-color 0.4s ease, color 0.35s ease, box-shadow 0.35s ease;
    }
    .hero-word, .hero-sub, .hero-cta, .hero-scroll { transition: none !important; }
    .reveal, .reveal-left, .reveal-right, .reveal-scale { transition: opacity 0.7s cubic-bezier(.22,1,.36,1), transform 0.7s cubic-bezier(.22,1,.36,1) !important; }

    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: var(--bg-2); }
    ::-webkit-scrollbar-thumb { background: var(--accent); border-radius: 3px; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }

    #bg-canvas {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }
    body, a, button, input, textarea, select, [role="button"] {
      cursor: default;
    }
    a, button, [role="button"], .track-btn, .theme-btn, .btn-primary, .btn-ghost, .nav-link {
      cursor: pointer;
    }
    input, textarea, select {
      cursor: text;
    }

    .hero-bottom-deco {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 120px;
      pointer-events: none;
      overflow: hidden;
    }
    .hero-wave-svg {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      width: 100%; height: 100%;
    }
    .wave-path-1 {
      stroke: var(--accent);
      stroke-width: 1;
      fill: none;
      opacity: 0.35;
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      animation: wave-draw 3.5s cubic-bezier(.22,1,.36,1) 1.6s forwards;
    }
    .wave-path-2 {
      stroke: var(--accent-3);
      stroke-width: 0.6;
      fill: none;
      opacity: 0.18;
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      animation: wave-draw 4s cubic-bezier(.22,1,.36,1) 1.9s forwards;
    }
    .hero-dots-row {
      position: absolute;
      bottom: 10px; left: 0; right: 0;
      display: flex;
      justify-content: center;
      gap: 6px;
      align-items: center;
    }
    .hero-dot-tick {
      width: 2px;
      border-radius: 1px;
      background: var(--accent);
      opacity: 0;
      animation: tick-fade 0.4s ease forwards;
    }
    @keyframes wave-draw {
      to { stroke-dashoffset: 0; }
    }
    @keyframes tick-fade {
      to { opacity: 1; }
    }

    #code-rain-canvas {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      width: 100%; height: 120px;
      pointer-events: none;
      opacity: 0.55;
    }

    .bg-mesh {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 70% 50% at 10% -5%,  var(--mesh-1) 0%, transparent 65%),
        radial-gradient(ellipse 55% 40% at 90% 105%, var(--mesh-2) 0%, transparent 60%),
        radial-gradient(ellipse 45% 55% at 50% 50%,  var(--mesh-3) 0%, transparent 70%);
      transition: background 0.45s ease;
    }
    .noise-overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 0; opacity: 0.03;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    }
    .grid-bg {
      position: absolute; inset: 0; pointer-events: none;
      background-image: linear-gradient(var(--grid-line) 1px, transparent 1px), linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse 80% 80% at 50% 50%, black 0%, transparent 100%);
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(40px) saturate(220%) brightness(1.08);
      -webkit-backdrop-filter: blur(40px) saturate(220%) brightness(1.08);
      box-shadow: var(--shadow-card);
      overflow: hidden;
      transition: border-color 0.3s ease, box-shadow 0.3s ease, transform 0.3s ease !important;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(
        180deg,
        var(--liquid-shine-top) 0%,
        var(--liquid-refraction) 35%,
        var(--liquid-shine-bottom) 100%
      );
      pointer-events: none;
      z-index: 1;
      border-radius: inherit;
    }
    .card::after {
      content: '';
      position: absolute;
      inset: -1px;
      border-radius: inherit;
      padding: 1.5px;
      background: var(--border-rainbow);
      background-size: 300% 300%;
      animation: liquid-border-shift 8s ease infinite;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      -webkit-mask-composite: xor;
      pointer-events: none;
      z-index: 2;
      opacity: 0.65;
    }
    @keyframes liquid-border-shift {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .card:hover {
      border-color: rgba(255, 255, 255, 0.22);
      box-shadow: var(--shadow-card), 0 10px 30px rgba(200, 110, 70, 0.08);
    }
    .card:hover::after {
      opacity: 0.95;
    }

    .grad-text {
      background: linear-gradient(135deg, var(--text) 0%, var(--accent-2) 45%, var(--accent) 85%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    [data-theme="light"] .grad-text {
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }
    .grad-text-warm {
      background: linear-gradient(135deg, var(--accent-2) 0%, var(--accent-3) 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    }

    .btn-primary {
      position: relative;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: var(--btn-primary-text);
      border: 1px solid rgba(255,255,255,0.15); border-radius: 10px;
      font-weight: 700; font-size: 13px; letter-spacing: 0.04em;
      padding: 12px 28px; cursor: pointer;
      box-shadow: 0 4px 20px var(--btn-primary-shadow);
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s !important;
      overflow: hidden;
    }
    .btn-primary::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 50%;
      background: linear-gradient(180deg, rgba(255,255,255,0.25) 0%, transparent 100%);
      pointer-events: none;
    }
    .btn-primary:hover { opacity: 0.92; transform: translateY(-1px); box-shadow: 0 8px 32px var(--btn-primary-shadow-hover); }

    .btn-ghost {
      background: var(--surface-2); border: 1px solid var(--border); color: var(--text);
      border-radius: 10px; font-weight: 600; font-size: 13px; letter-spacing: 0.04em;
      padding: 12px 28px; cursor: pointer;
      display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
      transition: border-color 0.2s, background 0.2s, transform 0.2s !important;
    }
    .btn-ghost:hover { border-color: var(--border-2); background: var(--accent-soft); transform: translateY(-1px); }

    .theme-btn {
      width: 40px; height: 40px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface-2);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--text-muted);
      transition: border-color 0.2s, color 0.2s, transform 0.2s !important;
      flex-shrink: 0;
    }
    .theme-btn:hover { border-color: var(--border-2); color: var(--accent); transform: rotate(15deg) scale(1.05); }

    .eyebrow {
      font-family: 'JetBrains Mono', monospace; font-size: 11px;
      letter-spacing: 0.18em; text-transform: uppercase; color: var(--accent); font-weight: 600;
    }

    .nav-bar {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 0 32px; height: 64px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .nav-bar.scrolled {
      background: var(--nav-bg);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    }
    .nav-link {
      color: var(--text-muted); font-size: 13.5px; font-weight: 500;
      text-decoration: none; position: relative;
      transition: color 0.2s !important;
      cursor: pointer;
    }
    .nav-link:hover { color: var(--text); }
    .nav-link.active { color: var(--text); }
    .nav-link.active::after {
      content: ''; position: absolute; bottom: -4px; left: 0; right: 0;
      height: 2px; background: var(--accent); border-radius: 2px;
    }

    @keyframes marquee { from { transform: translateX(0); } to { transform: translateX(-50%); } }
    .marquee-track { display: flex; width: max-content; animation: marquee 32s linear infinite; }
    .marquee-wrap:hover .marquee-track { animation-play-state: paused; }

    .reveal       { opacity: 0; transform: translateY(32px); }
    .reveal-left  { opacity: 0; transform: translateX(-32px); }
    .reveal-right { opacity: 0; transform: translateX(32px); }
    .reveal-scale { opacity: 0; transform: scale(0.94); }
    .reveal.visible, .reveal-left.visible, .reveal-right.visible, .reveal-scale.visible {
      opacity: 1; transform: translateY(0) translateX(0) scale(1);
    }

    .feature-icon {
      width: 48px; height: 48px; border-radius: 12px; flex-shrink: 0;
      display: flex; align-items: center; justify-content: center;
      background: var(--accent-soft); border: 1px solid rgba(218,119,68,0.20);
    }

    .faq-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 0.38s cubic-bezier(.22,1,.36,1) !important; }
    .faq-body.open { grid-template-rows: 1fr; }
    .faq-body > div { overflow: hidden; min-height: 0; }

    #progress-bar {
      position: fixed; top: 0; left: 0; height: 2px; z-index: 200;
      background: var(--progress-grad); width: 0%; transition: width 0.1s linear !important;
    }

    .tag {
      font-family: 'JetBrains Mono', monospace; font-size: 10px; font-weight: 600;
      letter-spacing: 0.12em; text-transform: uppercase; padding: 4px 10px; border-radius: 6px;
      background: var(--accent-soft); color: var(--accent); border: 1px solid rgba(218,119,68,0.20);
    }

    @keyframes glow-pulse {
      0%,100% { box-shadow: 0 0 0 0 var(--glow-pulse-from); }
      50%      { box-shadow: 0 0 0 6px var(--glow-pulse-to); }
    }
    .glow-dot { animation: glow-pulse 2.5s ease-in-out infinite; }

    @keyframes float-caret { 0%,100% { transform: translateY(0); } 50% { transform: translateY(6px); } }
    .float-caret { animation: float-caret 2.2s ease-in-out infinite; }

    @keyframes float-p {
      0%,100% { transform: translateY(0) scale(1); opacity: 0.45; }
      50%      { transform: translateY(-28px) scale(1.3); opacity: 0.85; }
    }

    .mobile-menu {
      position: fixed; inset: 0; z-index: 90;
      background: var(--mobile-bg); backdrop-filter: blur(24px);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 36px;
      opacity: 0; pointer-events: none; transition: opacity 0.3s ease !important;
    }
    .mobile-menu.open { opacity: 1; pointer-events: all; }

    .track-btn { transition: all 0.25s ease !important; }
    .track-btn.active { border-color: var(--accent) !important; background: var(--accent-soft) !important; }
    .viewport-btn { transition: all 0.2s !important; }
    .viewport-btn.active { background: var(--accent) !important; color: var(--btn-primary-text) !important; }

    .form-input {
      width: 100%; background: var(--surface-2); border: 1px solid var(--border);
      color: var(--text); border-radius: 10px; padding: 13px 16px;
      font-size: 14px; font-family: inherit; outline: none;
      transition: border-color 0.2s, box-shadow 0.2s !important;
    }
    .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
    .form-input::placeholder { color: var(--text-muted); }
    textarea.form-input { resize: vertical; min-height: 110px; }

    section { padding: 100px 24px; max-width: 1200px; margin: 0 auto; }
    @media (max-width: 768px) { section { padding: 72px 20px; } }
    @media (max-width: 900px)  { .hidden-mobile { display: none !important; } #mobile-toggle { display: flex !important; } }
    @media (max-width: 640px)  { .work-grid { grid-template-columns: 1fr !important; } .simulator-grid { grid-template-columns: 1fr !important; } }

    @media (prefers-reduced-motion: reduce) {
      .reveal, .reveal-left, .reveal-right, .reveal-scale { opacity: 1; transform: none; }
      .marquee-track, .float-caret, .glow-dot { animation: none; }
      .wave-path-1, .wave-path-2 { animation: none; stroke-dashoffset: 0; }
      body { cursor: auto; }
    }
  </style>
</head>
<body>
  <div class="bg-mesh"></div>
  <div class="noise-overlay"></div>
  <div id="progress-bar"></div>

  <canvas id="bg-canvas"></canvas>

  <script>
  /* ════ MOUSE-REACTIVE BACKGROUND ANIMATION — FAST FOLLOW ════ */
  (function () {
    const canvas = document.getElementById('bg-canvas');
    const ctx    = canvas.getContext('2d');

    let W, H;
    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize, { passive: true });

    // mouse — start off-screen
    let mx = -1000, my = -1000;
    let tx = -1000, ty = -1000; // smoothed target
    document.addEventListener('mousemove', e => {
      mx = e.clientX;
      my = e.clientY;
    }, { passive: true });

    function isDark() {
      return document.documentElement.getAttribute('data-theme') !== 'light';
    }

    // ── floating orbs ──
    const ORBS = Array.from({ length: 6 }, (_, i) => ({
      x: Math.random() * 1200,
      y: Math.random() * 800,
      vx: (Math.random() - 0.5) * 0.18,
      vy: (Math.random() - 0.5) * 0.18,
      r: 180 + Math.random() * 140,
      phase: Math.random() * Math.PI * 2,
    }));

    function lerp(a, b, t) { return a + (b - a) * t; }

    // ── persistent per-dot scale state (for smooth zoom) ──
    let dotState = null, dotCols = 0, dotRows = 0;
    const DOT_SPACING = 42;
    function ensureDotState() {
      const cols = Math.ceil(W / DOT_SPACING) + 1;
      const rows = Math.ceil(H / DOT_SPACING) + 1;
      if (cols !== dotCols || rows !== dotRows || !dotState) {
        dotCols = cols; dotRows = rows;
        dotState = new Float32Array(cols * rows);
      }
    }

    let last = 0;
    function loop(ts) {
      requestAnimationFrame(loop);
      if (ts - last < 6) return; // ~165fps cap for ultra-snappy response
      last = ts;

      ctx.clearRect(0, 0, W, H);

      const dark  = isDark();
      const t     = ts * 0.001;

      // ── NEAR-INSTANT mouse follower (0.62 = essentially glued to cursor) ──
      tx = lerp(tx, mx, 0.62);
      ty = lerp(ty, my, 0.62);

      // ── 1. mouse spotlight ──
      const spotR = 320;
      const spot  = ctx.createRadialGradient(tx, ty, 0, tx, ty, spotR);
      if (dark) {
        spot.addColorStop(0,   'rgba(218,119,68,0.10)');
        spot.addColorStop(0.5, 'rgba(218,119,68,0.04)');
        spot.addColorStop(1,   'rgba(218,119,68,0)');
      } else {
        spot.addColorStop(0,   'rgba(192,94,42,0.08)');
        spot.addColorStop(0.5, 'rgba(192,94,42,0.03)');
        spot.addColorStop(1,   'rgba(192,94,42,0)');
      }
      ctx.beginPath();
      ctx.arc(tx, ty, spotR, 0, Math.PI * 2);
      ctx.fillStyle = spot;
      ctx.fill();

      // ── 2. drifting ambient orbs ──
      for (const orb of ORBS) {
        orb.phase += 0.004;
        orb.x += orb.vx + Math.sin(orb.phase) * 0.12;
        orb.y += orb.vy + Math.cos(orb.phase * 0.7) * 0.10;
        if (orb.x < -orb.r) orb.x = W + orb.r;
        if (orb.x > W + orb.r) orb.x = -orb.r;
        if (orb.y < -orb.r) orb.y = H + orb.r;
        if (orb.y > H + orb.r) orb.y = -orb.r;

        // strong pull toward mouse
        const dx = tx - orb.x, dy = ty - orb.y;
        const dist = Math.sqrt(dx*dx + dy*dy) || 1;
        orb.x += (dx / dist) * 0.28;
        orb.y += (dy / dist) * 0.28;

        const g = ctx.createRadialGradient(orb.x, orb.y, 0, orb.x, orb.y, orb.r);
        if (dark) {
          g.addColorStop(0, 'rgba(218,119,68,0.055)');
          g.addColorStop(1, 'rgba(218,119,68,0)');
        } else {
          g.addColorStop(0, 'rgba(192,94,42,0.038)');
          g.addColorStop(1, 'rgba(192,94,42,0)');
        }
        ctx.beginPath();
        ctx.arc(orb.x, orb.y, orb.r, 0, Math.PI * 2);
        ctx.fillStyle = g;
        ctx.fill();
      }

      // ── 3. dot field — sparse & elegant at rest, sharp + responsive near cursor ──
      ensureDotState();
      const spacing   = DOT_SPACING;
      const radius    = 240;            // reaction range — tight enough to feel precise, not a slow blob
      const baseR     = 0.5;
      const baseAlpha = dark ? 0.05 : 0.035;  // dim, refined resting dots
      const hasMouse  = tx > -500 && ty > -500;

      for (let r = 0; r < dotRows; r++) {
        for (let c = 0; c < dotCols; c++) {
          const bx = c * spacing;
          const by = r * spacing;

          let target = 0;
          if (hasMouse) {
            const dx = tx - bx, dy = ty - by;
            const d  = Math.sqrt(dx*dx + dy*dy);
            if (d < radius) {
              const n = 1 - d / radius;
              target = n * n * n; // cubic falloff — sharper, more deliberate hotspot
            }
          }

          // Snappy, self-adjusting easing — fast in, fast (but smooth) settle out
          const idx = r * dotCols + c;
          const easeIn  = 0.5;  // grows almost instantly as cursor nears
          const easeOut = 0.16; // settles back confidently, no lingering
          const ease = target > dotState[idx] ? easeIn : easeOut;
          const cur = dotState[idx] + (target - dotState[idx]) * ease;
          dotState[idx] = cur;

          const dx2 = tx - bx, dy2 = ty - by;
          const px = bx + dx2 * cur * 0.05;
          const py = by + dy2 * cur * 0.05;

          const a  = baseAlpha + cur * 0.85;
          const sz = baseR + cur * 8.0;

          ctx.beginPath();
          ctx.arc(px, py, sz, 0, Math.PI * 2);
          ctx.fillStyle = dark
            ? `rgba(218,119,68,${a})`
            : `rgba(192,94,42,${a})`;
          ctx.fill();
        }
      }
    }
    requestAnimationFrame(loop);
  })();
  </script>

    function HeroBottomDeco() {
      const canvasRef = useRef(null);

      const W = 1440, H = 120;
      function makePath(yOffset, amp, freq, phase) {
        const pts = [];
        for (let x = 0; x <= W; x += 6) {
          const y = H/2 + yOffset + Math.sin((x / W) * freq * Math.PI * 2 + phase) * amp
                    + Math.sin((x / W) * (freq*1.7) * Math.PI * 2 + phase * 0.8) * (amp*0.4);
          pts.push(`${x},${y.toFixed(2)}`);
        }
        return 'M' + pts.join(' L');
      }

      const ticks = useMemo(() => Array.from({length:32}, (_,i) => ({
        x: (i / 31) * 100,
        h: Math.random() * 18 + 4,
        delay: i * 60,
        opacity: Math.random() * 0.5 + 0.2,
      })), []);

      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        canvas.width  = canvas.offsetWidth;
        canvas.height = canvas.offsetHeight;

        const cols = Math.floor(canvas.width / 18);
        const drops = Array.from({length: cols}, () => Math.random() * -canvas.height);
        const chars = '01{}[]<>/\\|=+abcdefψδΩ∑';

        let raf;
        let frame = 0;

        function draw() {
          raf = requestAnimationFrame(draw);
          frame++;
          if (frame % 3 !== 0) return;

          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const accent = getComputedStyle(document.documentElement)
            .getPropertyValue('--accent').trim() || '#DA7744';

          for (let i = 0; i < drops.length; i++) {
            const char  = chars[Math.floor(Math.random() * chars.length)];
            const y     = drops[i];
            const alpha = Math.max(0, (y / canvas.height) * 0.5);
            ctx.font = '11px JetBrains Mono, monospace';
            ctx.fillStyle = accent.startsWith('#')
              ? hexToRgba(accent, alpha)
              : accent;
            if (y > 0) ctx.fillText(char, i * 18, y);

            drops[i] += 14;
            if (drops[i] > canvas.height + 20) drops[i] = -20 - Math.random() * 80;
          }
        }
        draw();
        return () => cancelAnimationFrame(raf);
      }, []);

      function hexToRgba(hex, alpha) {
        const c = hex.replace('#','');
        const r = parseInt(c.substring(0,2),16);
        const g = parseInt(c.substring(2,4),16);
        const b = parseInt(c.substring(4,6),16);
        return `rgba(${r},${g},${b},${alpha})`;
      }

      const path1 = makePath(-10, 22, 2.2, 0);
      const path2 = makePath(8,  14, 3.5, 1.1);

      return (
        <div style={{position:'absolute',bottom:0,left:0,right:0,height:120,pointerEvents:'none',overflow:'hidden'}}>
          <canvas ref={canvasRef} style={{position:'absolute',inset:0,width:'100%',height:'100%',opacity:0.45}}/>
          <svg viewBox={`0 0 ${W} ${H}`} preserveAspectRatio="none"
            style={{position:'absolute',inset:0,width:'100%',height:'100%'}}>
            <defs>
              <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
                <stop offset="0%" stopColor="transparent"/>
                <stop offset="20%" stopColor="var(--accent)" stopOpacity="1"/>
                <stop offset="80%" stopColor="var(--accent-3)" stopOpacity="1"/>
                <stop offset="100%" stopColor="transparent"/>
              </linearGradient>
            </defs>
            <path d={path1} stroke="url(#wave-grad)" strokeWidth="1" fill="none" className="wave-path-1"/>
            <path d={path2} stroke="var(--accent-3)" strokeWidth="0.7" fill="none" className="wave-path-2" opacity="0.3"/>
          </svg>
          <div style={{position:'absolute',bottom:0,left:0,right:0,display:'flex',alignItems:'flex-end',justifyContent:'space-between',padding:'0 24px'}}>
            {ticks.map((t,i)=>(
              <div key={i} style={{
                width:1.5, height:t.h, borderRadius:1,
                background:'var(--accent)',
                opacity: t.opacity,
                animation:`tick-fade 0.4s ease ${t.delay}ms both`,
              }}/>
            ))}
          </div>
        </div>
      );
    }

    function useReveal() {
      useEffect(()=>{
        const nodes = document.querySelectorAll('.reveal,.reveal-left,.reveal-right,.reveal-scale');
        const io = new IntersectionObserver(entries=>{
          entries.forEach(e=>{
            if(e.isIntersecting) e.target.classList.add('visible');
            else e.target.classList.remove('visible');
          });
        },{threshold:0.12,rootMargin:'0px 0px -40px 0px'});
        nodes.forEach(n=>io.observe(n));
        return ()=>io.disconnect();
      },[]);
    }

    // Every box on the site grows slightly as the cursor approaches it, and
    // eases back down as the cursor moves away. Writes transform as an
    // inline style (highest CSS specificity) so it layers cleanly on top of
    // the .reveal/.visible scroll-entry system without touching that CSS.
    function useCardProximity() {
      useEffect(() => {
        let mx = -9999, my = -9999;
        let cards = [];
        let raf = null;
        const PROX_RADIUS = 260; // px — how far away the effect starts reacting

        const refreshCards = () => {
          const els = Array.from(document.querySelectorAll('.card'));
          cards = els.map(el => {
            const existing = cards.find(c => c.el === el);
            return existing || { el, cur: 0 };
          });
        };

        const onMove = e => { mx = e.clientX; my = e.clientY; };
        window.addEventListener('mousemove', onMove, { passive: true });
        const onTouch = e => {
          if (e.touches && e.touches[0]) { mx = e.touches[0].clientX; my = e.touches[0].clientY; }
        };
        window.addEventListener('touchmove', onTouch, { passive: true });

        refreshCards();
        const mo = new MutationObserver(() => refreshCards());
        mo.observe(document.body, { childList: true, subtree: true });
        window.addEventListener('resize', refreshCards, { passive: true });

        function tick() {
          raf = requestAnimationFrame(tick);
          for (const c of cards) {
            const r = c.el.getBoundingClientRect();
            if (r.bottom < -200 || r.top > window.innerHeight + 200) continue; // skip far-offscreen
            const cx = Math.max(r.left, Math.min(mx, r.right));
            const cy = Math.max(r.top, Math.min(my, r.bottom));
            const dx = mx - cx, dy = my - cy;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const target = dist < PROX_RADIUS ? Math.pow(1 - dist / PROX_RADIUS, 2) : 0;
            const ease = target > c.cur ? 0.35 : 0.18;
            c.cur += (target - c.cur) * ease;
            if (Math.abs(c.cur) < 0.003) c.cur = 0;
            const scale = 1 + c.cur * 0.045;
            const lift  = c.cur * -3;
            c.el.style.transform = c.cur === 0 ? '' : `scale(${scale.toFixed(4)}) translateY(${lift.toFixed(2)}px)`;
          }
        }
        raf = requestAnimationFrame(tick);

        return () => {
          cancelAnimationFrame(raf);
          mo.disconnect();
          window.removeEventListener('mousemove', onMove);
          window.removeEventListener('touchmove', onTouch);
          window.removeEventListener('resize', refreshCards);
        };
      }, []);
    }

                  </button>
                  <div className={`faq-body ${openFaq===i?'open':''}`}>
                    <div>
                      <p style={{padding:'0 24px 20px',paddingTop:16,color:'var(--text-sub)',fontSize:14,lineHeight:1.75,borderTop:'1px solid var(--border)'}}>{item.a}</p>
                    </div>
                  </div>
                </div>
              ))}
            </div>
          </section>

          {/* CONTACT */}
          <section id="sec-contact">
            <div className="reveal" style={{textAlign:'center',maxWidth:560,margin:'0 auto 56px'}}>
              <div className="eyebrow" style={{marginBottom:16}}>Start a Project</div>
              <h2 style={{fontSize:'clamp(28px,3.5vw,48px)',fontWeight:800,letterSpacing:'-0.03em',lineHeight:1.1,marginBottom:16}}>Tell us what you're building.</h2>
              <p style={{color:'var(--text-sub)',fontSize:15}}>A few details now saves a lot of back-and-forth later.</p>
            </div>
            <div className="reveal-scale card" style={{maxWidth:640,margin:'0 auto',padding:'48px 44px'}}>
              <form onSubmit={sendWA} style={{display:'flex',flexDirection:'column',gap:22}}>
                <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:16}}>
                  <div>
                    <label style={{display:'block',fontFamily:'JetBrains Mono,monospace',fontSize:10,fontWeight:700,letterSpacing:'0.15em',textTransform:'uppercase',color:'var(--text-muted)',marginBottom:8}}>Your name *</label>
                    <input type="text" required className="form-input" value={form.name} onChange={e=>setForm({...form,name:e.target.value})} placeholder="e.g., Niranjan Thapa"/>
                  </div>
                  <div>
                    <label style={{display:'block',fontFamily:'JetBrains Mono,monospace',fontSize:10,fontWeight:700,letterSpacing:'0.15em',textTransform:'uppercase',color:'var(--text-muted)',marginBottom:8}}>Phone number *</label>
                    <input type="text" required className="form-input" value={form.phone} onChange={e=>setForm({...form,phone:e.target.value})} placeholder="+977 98XXXXXXXX"/>
                  </div>
                </div>
                <div>
                  <label style={{display:'block',fontFamily:'JetBrains Mono,monospace',fontSize:10,fontWeight:700,letterSpacing:'0.15em',textTransform:'uppercase',color:'var(--text-muted)',marginBottom:8}}>Business name (optional)</label>
                  <input type="text" className="form-input" value={form.business} onChange={e=>setForm({...form,business:e.target.value})} placeholder="e.g., Himalayan Trade Pvt. Ltd."/>
                </div>
                <div>
                  <label style={{display:'block',fontFamily:'JetBrains Mono,monospace',fontSize:10,fontWeight:700,letterSpacing:'0.15em',textTransform:'uppercase',color:'var(--text-muted)',marginBottom:8}}>What do you need built?</label>
                  <textarea className="form-input" value={form.details} onChange={e=>setForm({...form,details:e.target.value})} placeholder="A few lines about the business and what the site needs to do..."/>
                </div>
                <div style={{background:'var(--accent-soft)',border:'1px solid rgba(218,119,68,0.18)',borderRadius:10,padding:'14px 16px',display:'flex',gap:12,alignItems:'flex-start'}}>
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" strokeWidth="2" style={{marginTop:2,flexShrink:0}}><circle cx="12" cy="12" r="10"/><path strokeLinecap="round" d="M12 8v4M12 16h.01"/></svg>
                  <p style={{color:'var(--text-sub)',fontSize:12,lineHeight:1.6}}>Sending this opens WhatsApp with everything filled in — nothing is submitted until you hit send there.</p>
                </div>
                <button type="submit" className="btn-primary" style={{fontSize:13,padding:'15px 24px',justifyContent:'center',borderRadius:10}}>
                  Send via WhatsApp
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2"><path strokeLinecap="round" d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/></svg>
                </button>
              </form>
            </div>
          </section>

          {/* FOOTER */}
          <footer style={{borderTop:'1px solid var(--border)',padding:'48px 40px',marginTop:40,background:'var(--surface)'}}>
            <div style={{maxWidth:1200,margin:'0 auto',display:'flex',flexWrap:'wrap',gap:24,alignItems:'center',justifyContent:'space-between'}}>
              <div>
                <div style={{fontFamily:'JetBrains Mono,monospace',fontSize:11,color:'var(--accent)',fontWeight:700,letterSpacing:'0.15em',textTransform:'uppercase',marginBottom:6}}>Webcraft Nepal</div>
                <div style={{color:'var(--text-muted)',fontSize:13}}>© 2026 Webcraft Nepal. Built in Biratnagar.</div>
              </div>
              <div style={{display:'flex',gap:24,flexWrap:'wrap'}}>
                {NAV.map(l=>(
                  <a key={l.id} href={`#sec-${l.id}`} onClick={e=>{e.preventDefault();scrollTo(l.id);}}
                    style={{color:'var(--text-muted)',fontSize:13,textDecoration:'none',transition:'color 0.2s'}}
                    onMouseEnter={e=>e.target.style.color='var(--accent)'}
                    onMouseLeave={e=>e.target.style.color='var(--text-muted)'}>{l.label}</a>
                ))}
              </div>
              <div style={{display:'flex',gap:20,fontFamily:'JetBrains Mono,monospace',fontSize:11,color:'var(--text-muted)'}}>
                <span style={{color:'var(--accent)'}}>// BIRATNAGAR</span>
                <span>26.4525° N</span>
                <span>87.2718° E</span>
              </div>
            </div>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
